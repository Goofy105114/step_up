services:
  - type: web
    name: stepup-api
    runtime: node
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Set all these manually in Render dashboard → Environment:
      - key: DATABASE_URL
        sync: false   # Supabase connection string
      - key: JWT_SECRET
        sync: false   # openssl rand -hex 32
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false   # your Vercel URL e.g. https://stepup.vercel.app
